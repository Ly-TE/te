[pytest]
# 测试目录
testpaths = tests

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=./reports/allure-results
    --html=./reports/report.html
    --self-contained-html
    --capture=no

# 标记定义
markers =
    smoke: 冒烟测试 - 快速验证核心功能
    regression: 回归测试 - 完整功能回归
    ui: UI测试 - 用户界面测试
    api: API测试 - 接口测试
    slow: 慢速测试 - 执行时间较长的测试
    critical: 关键测试 - 必须通过的测试
    integration: 集成测试 - 跨模块测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 超时配置
timeout = 300
timeout_method = thread

# 覆盖率
# 需要安装 pytest-cov
# addopts = --cov=src --cov-report=html --cov-report=term

# 并发执行
# 需要安装 pytest-xdist
# addopts = -n auto

# 重试机制
# 需要安装 pytest-rerunfailures
# addopts = --reruns=2 --reruns-delay=1
