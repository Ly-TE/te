<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 用量看板 - 开发工具箱</title>
    <link rel="icon" type="image/x-icon" href="../static/images/index-logo.png">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .ai-page-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .usage-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #eef2ff 100%);
            border: 1px solid #e6e9f2;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.08);
        }

        .usage-card .label {
            color: #667085;
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .usage-card .value {
            color: #2c3e50;
            font-size: 1.8rem;
            font-weight: 700;
            word-break: break-all;
        }

        .usage-card.used .value { color: #ff4757; }
        .usage-card.remain .value { color: #00b09b; }

        .search-row {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) auto;
            align-items: end;
            gap: 20px;
        }

        .search-row .input-group { margin-bottom: 0; }

        .search-row input {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            color: #2c3e50;
        }

        .search-row input::placeholder { color: #95a5a6; }

        .query-btn {
            min-width: 160px;
            height: 58px;
        }

        .progress-section {
            margin-top: 28px;
            padding: 24px;
            border-radius: 12px;
            background: #f8f9fa;
            border-left: 5px solid #667eea;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .progress-bar {
            height: 12px;
            background: #e9ecef;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: width 0.8s ease;
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .model-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .model-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .model-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(102, 126, 234, 0.15);
        }

        .model-name {
            color: #667eea;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            padding-left: 4px;
            word-break: break-all;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px dashed #e5e7eb;
            color: #2c3e50;
            font-size: 0.98rem;
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label { color: #667085; }

        .detail-value {
            font-weight: 700;
            text-align: right;
            word-break: break-all;
        }

        .money-value {
            color: #667eea;
            font-size: 1.05rem;
        }

        .querying-card {
            display: none;
            text-align: center;
        }

        .querying-card .loading-spinner { margin: 0 auto 18px; }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 4px solid rgba(102, 126, 234, 0.18);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            display: inline-block;
        }

        .btn-spinner {
            width: 18px;
            height: 18px;
            border-width: 2px;
            margin: 0;
        }

        #resultSection { display: none; }

        .page-tip {
            margin-top: 20px;
            padding: 16px 20px;
            color: #666;
            background: #f8f9fa;
            border-radius: 10px;
            line-height: 1.6;
        }

        .empty-result {
            text-align: center;
            color: #95a5a6;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            grid-column: 1 / -1;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            .ai-page-grid { grid-template-columns: 1fr; }
            .search-row { grid-template-columns: 1fr; }
            .query-btn { width: 100%; }
        }
    </style>
</head>
<body>
{% include '_sidebar.html' %}

<div class="main-content">
    <div class="content-header">
        <h1><i class="fas fa-robot"></i> AI 用量看板</h1>
        <p>查询 SpanAI Token 模型用量，统一展示总配额、已使用、剩余配额与各模型消耗明细。</p>
    </div>

    <div class="function-card">
        <h2><i class="fas fa-search-dollar"></i> 用量查询</h2>
        <div class="search-row">
            <div class="input-group">
                <label for="tokenName">查询名字</label>
                <input type="text" id="tokenName" placeholder="请输入姓名" autocomplete="off" autofocus>
            </div>
            <button type="button" id="searchBtn" class="btn encrypt-btn query-btn">
                <i class="fas fa-magnifying-glass" id="btnIcon"></i>
                <span id="btnText">查询用量</span>
                <span class="loading-spinner btn-spinner" id="loader" style="display: none;"></span>
            </button>
        </div>
        <div id="errorMsg" class="result-div error" style="display: none;"></div>
        <div class="page-tip">
            <i class="fas fa-circle-info"></i>
            输入姓名后点击查询，系统会同步云端用量数据；结果会在当前页面内展示。
        </div>
    </div>

    <div id="queryingSection" class="function-card querying-card">
        <div class="loading-spinner"></div>
        <h2 style="justify-content: center; border-bottom: none; margin-bottom: 8px; padding-bottom: 0;">正在同步云端用量...</h2>
        <p style="color: #666;">请稍候，正在获取模型使用数据</p>
    </div>

    <div id="resultSection">
        <div class="function-card">
            <h2><i class="fas fa-chart-pie"></i> 配额概览</h2>
            <div class="ai-page-grid">
                <div class="usage-card total">
                    <div class="label"><i class="fas fa-wallet"></i> 总配额</div>
                    <div id="valTotal" class="value">--</div>
                </div>
                <div class="usage-card used">
                    <div class="label"><i class="fas fa-arrow-trend-up"></i> 已使用</div>
                    <div id="valUsed" class="value">--</div>
                </div>
                <div class="usage-card remain">
                    <div class="label"><i class="fas fa-piggy-bank"></i> 当前剩余</div>
                    <div id="valRemain" class="value">--</div>
                </div>
            </div>
            <div class="progress-section">
                <div class="progress-header">
                    <span><i class="fas fa-gauge-high"></i> 账号总体消耗比例</span>
                    <span id="valPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="barFill" class="progress-fill"></div>
                </div>
            </div>
        </div>

        <div class="function-card">
            <h2><i class="fas fa-list-check"></i> 模型明细</h2>
            <div class="models-grid" id="modelsContainer"></div>
        </div>
    </div>
</div>

<script>
    const apiConfig = {
        endpoint: '/api/ai-price-usage'
    };

    const elements = {
        tokenName: document.getElementById('tokenName'),
        searchBtn: document.getElementById('searchBtn'),
        btnIcon: document.getElementById('btnIcon'),
        btnText: document.getElementById('btnText'),
        loader: document.getElementById('loader'),
        errorMsg: document.getElementById('errorMsg'),
        queryingSection: document.getElementById('queryingSection'),
        resultSection: document.getElementById('resultSection'),
        modelsContainer: document.getElementById('modelsContainer'),
        valTotal: document.getElementById('valTotal'),
        valUsed: document.getElementById('valUsed'),
        valRemain: document.getElementById('valRemain'),
        valPercent: document.getElementById('valPercent'),
        barFill: document.getElementById('barFill')
    };

    function setLoading(isLoading) {
        elements.searchBtn.disabled = isLoading;
        elements.loader.style.display = isLoading ? 'inline-block' : 'none';
        elements.btnIcon.style.display = isLoading ? 'none' : 'inline-block';
        elements.btnText.textContent = isLoading ? '查询中' : '查询用量';
        elements.queryingSection.style.display = isLoading ? 'block' : 'none';
    }

    function showError(message) {
        elements.errorMsg.textContent = message;
        elements.errorMsg.style.display = 'block';
    }

    function hideError() {
        elements.errorMsg.textContent = '';
        elements.errorMsg.style.display = 'none';
    }

    function formatMoney(value, digits = 2) {
        return `$${Number(value || 0).toFixed(digits)}`;
    }

    function formatNumber(value) {
        return Number(value || 0).toLocaleString();
    }

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    async function fetchUsage(tokenName) {
        const response = await fetch(`${apiConfig.endpoint}?token_name=${encodeURIComponent(tokenName)}&_t=${Date.now()}`);
        const data = await response.json();
        if (response.status === 429) {
            throw new Error('more bee are，please night try');
        }
        if (!response.ok) {
            throw new Error(data.error || '查询失败，请稍后重试');
        }
        return data;
    }

    function renderSummary(data) {
        const total = Number(data.total_quota_usd || 0);
        const used = Number(data.total_used_usd || 0);
        const remain = Number(data.total_remain_usd || 0);
        const percent = total > 0 ? Math.min((used / total) * 100, 100) : 0;

        elements.valTotal.textContent = formatMoney(total);
        elements.valUsed.textContent = formatMoney(used);
        elements.valRemain.textContent = formatMoney(remain);
        elements.valPercent.textContent = `${percent.toFixed(1)}%`;
        elements.barFill.style.width = '0%';
        requestAnimationFrame(() => {
            elements.barFill.style.width = `${percent}%`;
        });
    }

    function renderModels(models = []) {
        if (!models.length) {
            elements.modelsContainer.innerHTML = '<div class="empty-result">暂无模型用量明细</div>';
            return;
        }

        elements.modelsContainer.innerHTML = models.map(model => `
            <div class="model-card">
                <div class="model-name"><i class="fas fa-cube"></i> ${escapeHtml(model.model_name || '-')}</div>
                <div class="detail-row"><span class="detail-label">累计请求</span><span class="detail-value">${formatNumber(model.request_count)}</span></div>
                <div class="detail-row"><span class="detail-label">Prompt Tokens</span><span class="detail-value">${formatNumber(model.prompt_tokens)}</span></div>
                <div class="detail-row"><span class="detail-label">Completion Tokens</span><span class="detail-value">${formatNumber(model.completion_tokens)}</span></div>
                <div class="detail-row"><span class="detail-label">消耗金额</span><span class="detail-value money-value">${formatMoney(model.used_quota_usd, 4)}</span></div>
            </div>
        `).join('');
    }

    async function queryUsage() {
        const tokenName = elements.tokenName.value.trim();
        if (!tokenName) {
            showError('请输入查询姓名');
            elements.tokenName.focus();
            return;
        }

        hideError();
        elements.resultSection.style.display = 'none';
        elements.modelsContainer.innerHTML = '';
        setLoading(true);

        try {
            const result = await fetchUsage(tokenName);
            if (!result.success || !Array.isArray(result.data) || result.data.length === 0) {
                throw new Error(result.message || '未找到该 Token 的数据，请检查名字是否正确');
            }

            const usageData = result.data[0];
            renderSummary(usageData);
            renderModels(usageData.models || []);
            elements.resultSection.style.display = 'block';
        } catch (error) {
            showError(error.message || '查询失败，请稍后重试');
        } finally {
            setLoading(false);
        }
    }

    elements.searchBtn.addEventListener('click', queryUsage);
    elements.tokenName.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            queryUsage();
        }
    });
</script>
</body>
</html>
