<script>
    // 全局状态
    let isDecrypting = false;
    let currentFile = null;
    let currentEncoding = 'unknown';
    // 分片大小（1MB），大文件分片处理
    const CHUNK_SIZE = 1024 * 1024;
    // 节流定时器
    let inputCountTimer = null;
    let progressTimer = null;

    // 一次性获取所有DOM元素，避免重复查询
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const fileInfo = document.getElementById('fileInfo');
    const fileDetails = document.getElementById('fileDetails');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const lastModified = document.getElementById('lastModified');
    const fileInput = document.getElementById('fileInput');
    const decryptBtn = document.getElementById('decryptBtn');
    const saveBtn = document.getElementById('saveBtn');
    const detectBtn = document.getElementById('detectBtn');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const statusText = document.getElementById('statusText');
    const statistics = document.getElementById('statistics');
    const encodingAnalysis = document.getElementById('encodingAnalysis');
    const encodingResults = document.getElementById('encodingResults');
    const inputCount = document.getElementById('inputCount');
    const outputCount = document.getElementById('outputCount');
    const statLines = document.getElementById('statLines');
    const statEncrypted = document.getElementById('statEncrypted');
    const statSize = document.getElementById('statSize');
    const serverStatusSpan = document.querySelector('.server-status span:last-child');

    // ============= 核心：内置GBK/UTF-8解码逻辑，彻底移除CDN依赖 =============
    function decodeBytesToText(bytes, encoding = 'GBK') {
        try {
            if (encoding.includes('UTF-8')) {
                return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
            } else if (encoding.includes('GBK')) {
                return gbkDecode(bytes);
            } else if (encoding.includes('UTF-16')) {
                return new TextDecoder(encoding === 'UTF-16 LE' ? 'utf-16le' : 'utf-16be', { fatal: false }).decode(bytes);
            } else {
                return new TextDecoder('latin1', { fatal: false }).decode(bytes);
            }
        } catch (e) {
            console.warn('解码失败，降级为Latin1:', e);
            return new TextDecoder('latin1', { fatal: false }).decode(bytes);
        }
    }
    // 简易GBK解码（适配中文ANSI，无需外部库）
    function gbkDecode(bytes) {
        let result = '';
        let i = 0;
        const len = bytes.length;
        while (i < len) {
            const b1 = bytes[i];
            if (b1 < 0x80) {
                result += String.fromCharCode(b1);
                i++;
            } else if (b1 >= 0x81 && b1 <= 0xFE && i + 1 < len) {
                const b2 = bytes[i + 1];
                if (b2 >= 0x40 && b2 <= 0xFE) {
                    const code = (b1 - 0x80) * 0x100 + (b2 - 0x40);
                    result += String.fromCharCode(code + 0x8080);
                    i += 2;
                } else {
                    result += '?';
                    i++;
                }
            } else {
                result += '?';
                i++;
            }
        }
        return result;
    }
    // 尝试GBK解码兜底
    function tryGBKDecode(bytes) {
        try {
            return gbkDecode(bytes);
        } catch (e) {
            return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
        }
    }

    // ============= 文件读取与编码检测 =============
    function readFileAsArrayBuffer(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = () => reject(new Error('文件读取失败'));
            reader.readAsArrayBuffer(file);
        });
    }

    async function detectEncoding() {
        if (!currentFile) {
            showNotification('请先选择文件', 'warning');
            return;
        }
        try {
            showNotification('正在分析文件编码...', 'info');
            detectBtn.disabled = true;
            const arrayBuffer = await readFileAsArrayBuffer(currentFile);
            const bytes = new Uint8Array(arrayBuffer.slice(0, Math.min(1000, arrayBuffer.byteLength)));
            const analysis = analyzeBytes(bytes);

            encodingAnalysis.style.display = 'block';
            encodingResults.innerHTML = `
                <div>检测到的编码: <strong>${analysis.detectedEncoding}</strong></div>
                <div>置信度: <strong>${analysis.confidence}%</strong></div>
                <div>文件特征:</div>
                <div>• 检测字节数: ${analysis.totalBytes}</div>
                <div>• ASCII字符占比: ${analysis.asciiPercent}%</div>
                <div>• 高位字节占比: ${analysis.highBytePercent}%</div>
                <div>可能编码:</div>
                ${analysis.possibleEncodings.map(enc =>
                    `<div class="encoding-item ${enc.likely ? 'likely' : 'unlikely'}">
                        <i class="fas fa-${enc.likely ? 'check' : 'times'}-circle"></i>
                        ${enc.name}
                    </div>`
                ).join('')}
            `;

            currentEncoding = analysis.detectedEncoding;
            refreshInputTextWithCorrectEncoding(arrayBuffer);
            showNotification(`编码检测完成: ${analysis.detectedEncoding}`, 'success');
        } catch (error) {
            showNotification('编码检测失败: ' + error.message, 'error');
        } finally {
            detectBtn.disabled = false;
        }
    }

    function refreshInputTextWithCorrectEncoding(arrayBuffer) {
        if (!arrayBuffer) return;
        const bytes = new Uint8Array(arrayBuffer);
        inputText.value = decodeBytesToText(bytes, currentEncoding);
        updateInputCount();
    }

    function analyzeBytes(bytes) {
        let result = {
            totalBytes: bytes.length,
            asciiCount: 0,
            highByteCount: 0,
            possibleEncodings: []
        };

        for (const byte of bytes) {
            if (byte <= 127) result.asciiCount++;
            if (byte > 127) result.highByteCount++;
        }

        result.asciiPercent = ((result.asciiCount / bytes.length) * 100).toFixed(1);
        result.highBytePercent = ((result.highByteCount / bytes.length) * 100).toFixed(1);

        // 检查BOM标记
        let bomDetected = false;
        if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
            result.possibleEncodings.push({ name: 'UTF-8 (带BOM)', likely: true });
            bomDetected = true;
            result.detectedEncoding = 'UTF-8';
            result.confidence = 95;
        } else if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
            result.possibleEncodings.push({ name: 'UTF-16 LE (带BOM)', likely: true });
            bomDetected = true;
            result.detectedEncoding = 'UTF-16 LE';
            result.confidence = 95;
        } else if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
            result.possibleEncodings.push({ name: 'UTF-16 BE (带BOM)', likely: true });
            bomDetected = true;
            result.detectedEncoding = 'UTF-16 BE';
            result.confidence = 95;
        }

        // 无BOM时的编码猜测
        if (!bomDetected) {
            if (result.highBytePercent > 20 && result.highBytePercent < 60) {
                result.possibleEncodings.push({ name: 'GBK/GB2312 (中文ANSI)', likely: true });
                result.detectedEncoding = 'GBK';
                result.confidence = 90;
            } else if (result.highBytePercent < 10) {
                result.possibleEncodings.push({ name: 'UTF-8 (英文为主)', likely: true });
                result.detectedEncoding = 'UTF-8';
                result.confidence = 80;
            } else {
                result.possibleEncodings.push({ name: 'GBK/GB2312 (中文ANSI)', likely: true });
                result.possibleEncodings.push({ name: 'UTF-8', likely: false });
                result.detectedEncoding = 'GBK';
                result.confidence = 70;
            }
        }

        return result;
    }

    // ============= 主解密函数（分片处理，性能优化）=============
    async function startDecrypt() {
        if (isDecrypting || !currentFile) {
            showNotification('请先选择文件', 'warning');
            return;
        }

        isDecrypting = true;
        decryptBtn.disabled = true;
        saveBtn.disabled = true;
        detectBtn.disabled = true;
        updateStatus('开始解密...', 'info');
        updateProgress(0);

        try {
            showNotification('正在读取文件...', 'info');
            const arrayBuffer = await readFileAsArrayBuffer(currentFile);
            const totalBytes = arrayBuffer.byteLength;
            const originalBytes = new Uint8Array(arrayBuffer);
            const decryptedBytes = new Uint8Array(totalBytes);
            updateProgress(10);

            showNotification('正在分片解密字节...', 'info');
            // 分片解密，避免阻塞主线程
            for (let start = 0; start < totalBytes; start += CHUNK_SIZE) {
                const end = Math.min(start + CHUNK_SIZE, totalBytes);
                for (let i = start; i < end; i++) {
                    decryptedBytes[i] = originalBytes[i] ^ 67;
                }
                // 节流更新进度，减少DOM重绘
                if (start % (CHUNK_SIZE * 10) === 0) {
                    const progress = 10 + Math.min(80, (start / totalBytes) * 80);
                    updateProgress(progress);
                    await new Promise(resolve => requestAnimationFrame(resolve));
                }
            }
            updateProgress(90);

            showNotification(`正在解码文本（${currentEncoding}）...`, 'info');
            // 解码并清理控制字符
            const decodedText = currentEncoding !== 'unknown'
                ? cleanBasicControlChars(decodeBytesToText(decryptedBytes, currentEncoding))
                : cleanBasicControlChars(tryGBKDecode(decryptedBytes));

            // 一次性赋值结果，减少textarea操作
            outputText.value = `=== SDK日志解密结果 ===
解密时间: ${new Date().toLocaleString()}
文件编码: ${currentEncoding || '自动检测'}
总大小: ${formatFileSize(totalBytes)}
${'='.repeat(60)}

${decodedText}`;

            // 更新统计信息
            updateOutputCount();
            const lines = decodedText.split('\n');
            statLines.textContent = lines.length.toLocaleString();
            statSize.textContent = formatFileSize(totalBytes);
            statistics.style.display = 'grid';

            updateStatus(`解密完成（${currentEncoding} → UTF-8）`, 'success');
            updateProgress(100);
            saveBtn.disabled = false;
            showNotification('解密完成，中文已正常展示', 'success');

        } catch (error) {
            updateStatus('解密失败', 'error');
            showNotification('解密失败: ' + error.message, 'error');
            console.error('解密错误:', error);
        } finally {
            isDecrypting = false;
            decryptBtn.disabled = false;
            detectBtn.disabled = false;
        }
    }

    // ============= 文件操作函数 =============
    fileInput.addEventListener('change', handleFileSelected);
    function handleFileSelect() {
        fileInput.click();
    }
    async function handleFileSelected(e) {
        const file = e.target.files[0];
        if (file) await loadAndDecryptFile(file);
    }
    async function loadAndDecryptFile(file) {
        try {
            showNotification('正在加载文件...', 'info');
            currentFile = file;

            // 展示文件信息
            fileInfo.style.display = 'none';
            fileDetails.style.display = 'block';
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            lastModified.textContent = new Date().toLocaleString();

            // 读取文件并检测编码
            const arrayBuffer = await readFileAsArrayBuffer(file);
            const bytes = new Uint8Array(arrayBuffer.slice(0, 1000));
            const analysis = analyzeBytes(bytes);
            currentEncoding = analysis.detectedEncoding;

            // 渲染原始内容
            refreshInputTextWithCorrectEncoding(arrayBuffer);
            // 延迟自动解密，让出主线程
            setTimeout(() => startDecrypt(), 300);
            showNotification(`文件加载成功（编码：${currentEncoding}）`, 'success');
        } catch (error) {
            showNotification('文件加载失败: ' + error.message, 'error');
        }
    }

    // ============= 保存结果与清空函数 =============
    function saveResult() {
        const result = outputText.value.trim();
        if (!result) {
            showNotification('没有可保存的内容', 'warning');
            return;
        }

        try {
            const blob = new Blob([result], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFile
                ? `decrypted_${currentFile.name.replace(/\.[^/.]+$/, "")}.txt`
                : 'sdk_decrypted_result.txt';
            a.click();
            URL.revokeObjectURL(url);
            showNotification(`保存成功：${a.download}（UTF-8编码）`, 'success');
        } catch (error) {
            showNotification('保存失败: ' + error.message, 'error');
        }
    }

    function clearAll() {
        if (isDecrypting && !confirm('解密正在进行中，确定要清空所有内容吗？')) {
            return;
        }

        inputText.value = '';
        outputText.value = '';
        fileInput.value = '';
        inputCount.textContent = '0 字符';
        outputCount.textContent = '0 字符';

        fileInfo.style.display = 'block';
        fileDetails.style.display = 'none';
        encodingAnalysis.style.display = 'none';
        statistics.style.display = 'none';

        currentFile = null;
        currentEncoding = 'unknown';

        updateStatus('已清空所有内容', 'info');
        updateProgress(0);
        saveBtn.disabled = true;

        showNotification('所有内容已清空', 'info');
    }

    // ============= 工具函数（通用）=============
    function isValidUTF8(bytes) {
        let i = 0;
        while (i < bytes.length) {
            const b = bytes[i];
            if (b <= 0x7F) { i++; continue; }
            if (b >= 0xC2 && b <= 0xDF) { if (i+1 >= bytes.length) return false; i +=2; }
            else if (b >= 0xE0 && b <= 0xEF) { if (i+2 >= bytes.length) return false; i +=3; }
            else if (b >= 0xF0 && b <= 0xF4) { if (i+3 >= bytes.length) return false; i +=4; }
            else return false;
        }
        return true;
    }

    function hasChineseButGarbage(text) {
        if (!text) return false;
        const hasChinese = /[\u4e00-\u9fa5]/.test(text);
        const hasGarbage = /�|\?\?|[\uE000-\uF8FF]/.test(text);
        return hasChinese && hasGarbage;
    }

    function cleanBasicControlChars(text) {
        return text ? text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '') : '';
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }

    function updateProgress(percent) {
        if (progressTimer) clearTimeout(progressTimer);
        progressTimer = setTimeout(() => {
            const p = Math.min(100, Math.max(0, percent));
            progressFill.style.width = p + '%';
            progressText.textContent = p.toFixed(0) + '%';
        }, 50);
    }

    function updateStatus(message, type) {
        const iconMap = {
            info: 'info-circle',
            success: 'check-circle',
            error: 'exclamation-circle',
            warning: 'exclamation-triangle'
        };
        const colorMap = {
            info: '#3498db',
            success: '#2ecc71',
            error: '#e74c3c',
            warning: '#f39c12'
        };
        statusText.innerHTML = `<i class="fas fa-${iconMap[type] || 'info-circle'}" style="color: ${colorMap[type] || '#3498db'};"></i> ${message}`;
    }

    function throttleUpdateInputCount() {
        if (inputCountTimer) clearTimeout(inputCountTimer);
        inputCountTimer = setTimeout(updateInputCount, 50);
    }

    function updateInputCount() {
        inputCount.textContent = inputText.value.length.toLocaleString() + ' 字符';
    }

    function updateOutputCount() {
        outputCount.textContent = outputText.value.length.toLocaleString() + ' 字符';
    }

    function showNotification(message, type) {
        const existing = document.querySelector('.notification');
        if (existing) existing.remove();

        const notification = document.createElement('div');
        const iconMap = {
            success: 'check-circle',
            error: 'exclamation-circle',
            warning: 'exclamation-triangle',
            info: 'info-circle'
        };
        notification.className = `notification notification-${type}`;
        notification.innerHTML = `<i class="fas fa-${iconMap[type]}"></i><span>${message}</span>`;
        document.body.appendChild(notification);

        setTimeout(() => {
            notification.style.animation = 'slideIn 0.3s ease reverse';
            setTimeout(() => notification.remove(), 300);
        }, 5000);
    }

    // ============= 拖放支持 =============
    inputText.addEventListener('dragover', (e) => {
        e.preventDefault();
        inputText.style.borderColor = '#e74c3c';
        inputText.style.boxShadow = '0 0 0 2px rgba(231,76,60,0.2)';
    });

    ['dragleave', 'drop'].forEach(evt => {
        inputText.addEventListener(evt, (e) => {
            e.preventDefault();
            inputText.style.borderColor = '#ddd';
            inputText.style.boxShadow = 'none';
            if (evt === 'drop' && e.dataTransfer.files.length) {
                const file = e.dataTransfer.files[0];
                if (/\.(log|txt|json)$/i.test(file.name)) {
                    loadAndDecryptFile(file);
                } else {
                    showNotification('不支持的文件类型', 'error');
                }
            }
        });
    });

    // ============= 键盘快捷键 =============
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey) {
            switch (e.key) {
                case 'o': e.preventDefault(); handleFileSelect(); break;
                case 'd': e.preventDefault(); startDecrypt(); break;
                case 's': e.preventDefault(); if (!saveBtn.disabled) saveResult(); break;
                case 'l': e.preventDefault(); clearAll(); break;
            }
        } else if (e.key === 'Escape') {
            const n = document.querySelector('.notification');
            if (n) n.remove();
        }
    });

    // ============= 初始化 =============
    function init() {
        updateStatus('工具已就绪（大文件分片优化）', 'success');
        updateProgress(0);
        // 定时更新状态时间
        const updateTime = () => {
            serverStatusSpan.textContent = `SDK日志解密工具 - ${new Date().toLocaleTimeString()} - 已就绪（GBK/UTF-8双支持）`;
        };
        updateTime();
        setInterval(updateTime, 60000);
        // 延迟显示初始化通知
        setTimeout(() => {
            showNotification('SDK日志解密工具加载完成，支持大文件分片处理', 'info');
        }, 500);
    }
