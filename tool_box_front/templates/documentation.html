    // 页面加载完成后的初始化
    document.addEventListener('DOMContentLoaded', function() {
        // 设置当前页面激活状态 - 修改后的代码
        const menuItems = document.querySelectorAll('.menu-item'); // 选择所有<a>标签
        const currentPage = window.location.pathname.split('/').pop() || 'documentation.html';

        menuItems.forEach(item => {
            const href = item.getAttribute('href');
            if (href === currentPage) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    });
