<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密解密工具 - 开发工具箱</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- 侧边栏 -->
<div class="sidebar">
    <div class="logo">
        <h2><i class="fas fa-toolbox"></i> 开发工具箱</h2>
        <p>v1.1.0</p>
    </div>
    <ul class="menu">
        <li>
            <a href="index.html" class="menu-item">
                <i class="fas fa-home"></i> 首页
            </a>
        </li>
        <li>
            <a href="encryption.html" class="menu-item active">
                <i class="fas fa-lock"></i> 加密解密工具
            </a>
        </li>
        <li>
            <a href="json-format.html" class="menu-item">
                <i class="fas fa-code"></i> JSON格式化
            </a>
        </li>
        <li>
            <a href="api-test.html" class="menu-item">
                <i class="fas fa-plug"></i> API测试
            </a>
        </li>
        <li>
            <a href="documentation.html" class="menu-item">
                <i class="fas fa-book"></i> 使用文档
            </a>
        </li>
        <li>
            <a href="about.html" class="menu-item">
                <i class="fas fa-info-circle"></i> 关于我们
            </a>
        </li>
    </ul>
</div>

<!-- 主内容区 -->
<div class="main-content">
    <div class="content-header">
        <h1>AES加密解密工具箱</h1>
        <p>基于AES-ECB算法的安全加密解密服务。支持数字和字符串的加密处理。</p>
    </div>

    <div class="function-card">
        <h2><i class="fas fa-lock"></i> 数据加密/解密</h2>

        <div class="input-group">
            <label for="numbersInput">
                <i class="fas fa-keyboard"></i> 输入要处理的文本：
            </label>
            <input type="text" id="numbersInput"
                   placeholder="请输入要加密的数字或要解密的Base64字符串..."
                   autocomplete="off">
        </div>

        <div class="button-group">
            <button class="btn encrypt-btn" id="encryptButton">
                <i class="fas fa-shield-alt"></i> 加密数据
            </button>
            <button class="btn decrypt-btn" id="decryptButton">
                <i class="fas fa-unlock"></i> 解密数据
            </button>
            <button class="btn" id="clearButton" style="background: #95a5a6; color: white;">
                <i class="fas fa-broom"></i> 清空所有
            </button>
        </div>

        <div class="result-container">
            <h3><i class="fas fa-poll"></i> 处理结果</h3>
            <div id="resultDiv" class="result-div">
                等待处理结果...
            </div>
        </div>

        <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px;">
            <h4><i class="fas fa-lightbulb"></i> 使用提示：</h4>
            <ul style="margin-top: 10px; padding-left: 20px; color: #666;">
                <li>加密功能支持任意数字输入</li>
                <li>解密功能需要输入完整的Base64加密结果</li>
                <li>密钥已固定为：<code>leigod0123456789</code></li>
                <li>使用快捷键：Ctrl+E (加密) / Ctrl+D (解密) / ESC (清空)</li>
            </ul>
        </div>
    </div>
</div>

<!-- 服务器状态 -->
<div class="server-status">
    <span class="status-dot"></span>
    <span>服务运行中: 10.1.3.160:5000</span>
</div>

<script>
    // 初始化DOM元素
    const encryptButton = document.getElementById('encryptButton');
    const decryptButton = document.getElementById('decryptButton');
    const clearButton = document.getElementById('clearButton');
    const numbersInput = document.getElementById('numbersInput');
    const resultDiv = document.getElementById('resultDiv');

    // API基础URL
    const baseurl = 'http://10.1.3.160:5000';

    // 显示消息函数
    function showMessage(element, message, type = 'info') {
        element.textContent = message;
        element.className = 'result-div';

        if (type === 'success') {
            element.classList.add('success');
        } else if (type === 'error') {
            element.classList.add('error');
        } else if (type === 'loading') {
            element.classList.add('loading');
        }
    }

    // 通用请求函数
    async function sendPostRequest(endpoint, data) {
        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorText}`);
            }

            return await response.json();
        } catch (error) {
            throw new Error(`请求失败: ${error.message}`);
        }
    }

    // 加密处理
    encryptButton.addEventListener('click', async () => {
        const numbersToEncrypt = numbersInput.value.trim();

        if (!numbersToEncrypt) {
            showMessage(resultDiv, '请输入要加密的内容！', 'error');
            numbersInput.focus();
            return;
        }

        showMessage(resultDiv, '正在加密中...', 'loading');

        try {
            const result = await sendPostRequest('/encrypt', {
                numbers: numbersToEncrypt
            });

            if (result.encryptedResult) {
                showMessage(resultDiv, `✅ 加密成功！\n\n加密结果：\n${result.encryptedResult}\n\n提示：您可以复制此结果到输入框进行解密测试。`, 'success');
            } else if (result.error) {
                showMessage(resultDiv, `❌ 加密失败：${result.error}`, 'error');
            }
        } catch (error) {
            showMessage(resultDiv, `❌ 加密失败：${error.message}`, 'error');
        }
    });

    // 解密处理
    decryptButton.addEventListener('click', async () => {
        const encryptedResultStr = numbersInput.value.trim();

        if (!encryptedResultStr) {
            showMessage(resultDiv, '请输入要解密的内容！', 'error');
            numbersInput.focus();
            return;
        }

        showMessage(resultDiv, '正在解密中...', 'loading');

        try {
            const response = await fetch('/decrypt', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ encryptedResult: encryptedResultStr })
            });

            const text = await response.text();

            try {
                const data = JSON.parse(text);
                if (data.error) {
                    showMessage(resultDiv, `❌ 解密失败：${data.error}`, 'error');
                }
            } catch {
                if (response.ok) {
                    showMessage(resultDiv, `✅ 解密成功！\n\n原始数据：\n${text}`, 'success');
                } else {
                    showMessage(resultDiv, `❌ 解密失败：${text}`, 'error');
                }
            }
        } catch (error) {
            showMessage(resultDiv, `❌ 解密失败：${error.message}`, 'error');
        }
    });

    // 清空按钮
    clearButton.addEventListener('click', () => {
        numbersInput.value = '';
        showMessage(resultDiv, '等待处理结果...', 'info');
        numbersInput.focus();
    });

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'e') {
            e.preventDefault();
            encryptButton.click();
        }
        if (e.ctrlKey && e.key === 'd') {
            e.preventDefault();
            decryptButton.click();
        }
        if (e.key === 'Escape') {
            clearButton.click();
        }
        if (e.key === 'Enter' && e.ctrlKey) {
            e.preventDefault();
            encryptButton.click();
        }
    });

    // 页面加载完成后的初始化
    document.addEventListener('DOMContentLoaded', function() {
        // 设置当前页面激活状态 - 修改后的代码
        const menuItems = document.querySelectorAll('.menu-item'); // 选择所有<a>标签
        const currentPage = window.location.pathname.split('/').pop() || 'encryption.html';

        menuItems.forEach(item => {
            const href = item.getAttribute('href');
            if (href === currentPage) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });

        // 输入框自动聚焦
        numbersInput.focus();

        // 显示初始状态
        setTimeout(() => {
            showMessage(resultDiv, '✅ 服务已准备就绪，请输入要处理的内容...', 'success');
        }, 500);
    });
</script>
</body>
</html>
