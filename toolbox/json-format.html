<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON格式化 - 开发工具箱</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- 侧边栏 -->
<div class="sidebar">
    <div class="logo">
        <h2><i class="fas fa-toolbox"></i> 开发工具箱</h2>
        <p>v1.1.0</p>
    </div>
    <ul class="menu">
        <li>
            <a href="index.html" class="menu-item">
                <i class="fas fa-home"></i> 首页
            </a>
        </li>
        <li>
            <a href="encryption.html" class="menu-item">
                <i class="fas fa-lock"></i> 加密解密工具
            </a>
        </li>
        <li>
            <a href="json-format.html" class="menu-item active">
                <i class="fas fa-code"></i> JSON格式化
            </a>
        </li>
        <li>
            <a href="api-test.html" class="menu-item">
                <i class="fas fa-plug"></i> API测试
            </a>
        </li>
        <li>
            <a href="documentation.html" class="menu-item">
                <i class="fas fa-book"></i> 使用文档
            </a>
        </li>
        <li>
            <a href="about.html" class="menu-item">
                <i class="fas fa-info-circle"></i> 关于我们
            </a>
        </li>
    </ul>
</div>

<!-- 主内容区 -->
<div class="main-content">
    <div class="content-header">
        <h1>JSON格式化工具</h1>
        <p>美化和验证JSON数据格式，提高开发效率</p>
    </div>

    <div class="function-card">
        <h2><i class="fas fa-code"></i> JSON格式化工具</h2>

        <div class="input-group">
            <label for="jsonInput">
                <i class="fas fa-edit"></i> 输入JSON字符串：
            </label>
            <textarea id="jsonInput" placeholder='{"name": "示例", "age": 25, "data": [1, 2, 3]}'></textarea>
        </div>

        <div class="button-group">
            <button class="btn" id="formatJsonBtn" style="background: #3498db; color: white;">
                <i class="fas fa-indent"></i> 格式化
            </button>
            <button class="btn" id="validateJsonBtn" style="background: #2ecc71; color: white;">
                <i class="fas fa-check-circle"></i> 验证
            </button>
            <button class="btn" id="compressJsonBtn" style="background: #9b59b6; color: white;">
                <i class="fas fa-compress"></i> 压缩
            </button>
            <button class="btn" id="clearJsonBtn" style="background: #95a5a6; color: white;">
                <i class="fas fa-broom"></i> 清空
            </button>
        </div>

        <div class="result-container">
            <h3><i class="fas fa-poll"></i> 处理结果</h3>
            <div id="jsonResult" class="result-div">
                JSON处理结果将显示在这里...
            </div>
        </div>

        <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px;">
            <h4><i class="fas fa-lightbulb"></i> 使用说明：</h4>
            <ul style="margin-top: 10px; padding-left: 20px; color: #666;">
                <li><strong>格式化</strong>：添加缩进和换行，提高可读性</li>
                <li><strong>验证</strong>：检查JSON语法是否正确</li>
                <li><strong>压缩</strong>：移除所有空白字符，减小体积</li>
                <li>支持标准的JSON格式，包括对象、数组、字符串、数字等</li>
                <li>使用快捷键：Ctrl+F (格式化) / Ctrl+V (验证)</li>
            </ul>
        </div>
    </div>
</div>

<!-- 服务器状态 -->
<div class="server-status">
    <span class="status-dot"></span>
    <span>JSON格式化工具</span>
</div>

<script>
    // 初始化DOM元素
    const jsonInput = document.getElementById('jsonInput');
    const jsonResult = document.getElementById('jsonResult');
    const formatJsonBtn = document.getElementById('formatJsonBtn');
    const validateJsonBtn = document.getElementById('validateJsonBtn');
    const compressJsonBtn = document.getElementById('compressJsonBtn');
    const clearJsonBtn = document.getElementById('clearJsonBtn');

    // 显示消息函数
    function showMessage(element, message, type = 'info') {
        element.textContent = message;
        element.className = 'result-div';

        if (type === 'success') {
            element.classList.add('success');
        } else if (type === 'error') {
            element.classList.add('error');
        }
    }

    // 格式化JSON
    formatJsonBtn.addEventListener('click', () => {
        const jsonStr = jsonInput.value.trim();

        if (!jsonStr) {
            showMessage(jsonResult, '请输入JSON字符串！', 'error');
            jsonInput.focus();
            return;
        }

        try {
            const obj = JSON.parse(jsonStr);
            const formatted = JSON.stringify(obj, null, 2);
            showMessage(jsonResult, formatted, 'success');
        } catch (error) {
            showMessage(jsonResult, `❌ JSON格式错误：\n${error.message}`, 'error');
        }
    });

    // 验证JSON
    validateJsonBtn.addEventListener('click', () => {
        const jsonStr = jsonInput.value.trim();

        if (!jsonStr) {
            showMessage(jsonResult, '请输入JSON字符串！', 'error');
            jsonInput.focus();
            return;
        }

        try {
            JSON.parse(jsonStr);
            showMessage(jsonResult, '✅ JSON格式正确！', 'success');
        } catch (error) {
            showMessage(jsonResult, `❌ JSON格式错误：\n${error.message}`, 'error');
        }
    });

    // 压缩JSON
    compressJsonBtn.addEventListener('click', () => {
        const jsonStr = jsonInput.value.trim();

        if (!jsonStr) {
            showMessage(jsonResult, '请输入JSON字符串！', 'error');
            jsonInput.focus();
            return;
        }

        try {
            const obj = JSON.parse(jsonStr);
            const compressed = JSON.stringify(obj);
            showMessage(jsonResult, compressed, 'success');
        } catch (error) {
            showMessage(jsonResult, `❌ JSON格式错误：\n${error.message}`, 'error');
        }
    });

    // 清空JSON
    clearJsonBtn.addEventListener('click', () => {
        jsonInput.value = '';
        showMessage(jsonResult, 'JSON处理结果将显示在这里...', 'info');
        jsonInput.focus();
    });

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'f') {
            e.preventDefault();
            formatJsonBtn.click();
        }
        if (e.ctrlKey && e.key === 'v') {
            e.preventDefault();
            validateJsonBtn.click();
        }
        if (e.key === 'Escape') {
            clearJsonBtn.click();
        }
    });

    // 页面加载完成后的初始化 - 修改后的版本
    document.addEventListener('DOMContentLoaded', function() {
        // 设置当前页面激活状态
        const menuItems = document.querySelectorAll('.menu-item'); // 这里选择的是<a>标签

        // 获取当前页面文件名
        const currentPage = window.location.pathname.split('/').pop() || 'json-format.html';

        menuItems.forEach(item => {
            const href = item.getAttribute('href');
            // 检查当前URL是否包含这个href
            if (href === currentPage) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });

        // 输入框自动聚焦
        jsonInput.focus();

        // 显示初始状态
        setTimeout(() => {
            showMessage(jsonResult, '✅ JSON格式化工具已准备就绪', 'success');
        }, 500);
    });
</script>
</body>
</html>
