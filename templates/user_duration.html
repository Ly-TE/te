    <!-- 全局时长操作防护 -->
    <script>
        // 全局时长操作防护函数
        function validateAndLimitMinutes(minutes) {
            const maxDeductMinutes = 60000000; // 最大扣减分钟数（支持1000000小时）
            const minDeductMinutes = -60000000; // 最小扣减分钟数

            // 类型检查和转换
            let validatedMinutes = Number(minutes);
            if (isNaN(validatedMinutes)) {
                console.error('时长参数无效:', minutes);
                return 0;
            }

            // 范围限制
            if (validatedMinutes > maxDeductMinutes) {
                console.warn(`时长参数过大: ${validatedMinutes}，限制为${maxDeductMinutes}`);
                validatedMinutes = maxDeductMinutes;
            } else if (validatedMinutes < minDeductMinutes) {
                console.warn(`时长参数过小: ${validatedMinutes}，限制为${minDeductMinutes}`);
                validatedMinutes = minDeductMinutes;
            }

            console.log(`时长参数验证通过: ${minutes} → ${validatedMinutes}`);
            return validatedMinutes;
        }

        // 全局钩子：拦截所有时长相关的API调用
        (function() {
            const originalFetch = window.fetch;
            window.fetch = function(url, options) {
                // 检查是否是时长相关的API调用
                if (url && url.includes('/duration') && options && options.body) {
                    try {
                        // 解析请求体
                        const body = typeof options.body === 'string' ?
                            new URLSearchParams(options.body) : options.body;

                        if (body.has && body.has('minutes')) {
                            const originalMinutes = body.get('minutes');
                            const validatedMinutes = validateAndLimitMinutes(originalMinutes);

                            // 更新请求参数
                            if (typeof options.body === 'string') {
                                const params = new URLSearchParams(options.body);
                                params.set('minutes', validatedMinutes.toString());
                                options.body = params.toString();
                            } else {
                                body.set('minutes', validatedMinutes.toString());
                            }

                            console.log('=== 全局时长参数拦截 ===');
                            console.log('原始参数:', originalMinutes);
                            console.log('修正参数:', validatedMinutes);
                        }
                    } catch (error) {
                        console.error('全局时长拦截器出错:', error);
                    }
                }

                return originalFetch.call(this, url, options);
            };
        })();
    </script>

<script>
    let accountToken = '';

    const accountList = [
        { phone: '19900000000', smscode: '1' },
        { phone: '19900000001', smscode: '1' },
        { phone: '19900000002', smscode: '1' },
        { phone: '19900000003', smscode: '1' },

    // 随机选择一个账号

    // 显示消息（保留原有功能）
    function showMessage(message, type = 'info') {
        const msgEl = document.getElementById('statusMessage');
        msgEl.textContent = message;
        msgEl.className = `status-message ${type}`;
        msgEl.style.display = 'block';
        
        setTimeout(() => {
            msgEl.style.display = 'none';
        }, 5000);
    }
    
    // Toast队列管理
    let toastQueue = [];
    let isToastShowing = false;
    let toastProcessingLock = false; // 新增：处理锁，防止并发处理
    
    // 调试计数器
    let toastDebugCounter = 0;
    
    // 显示Toast消息
    function showToast(message, type = 'info', duration = 3000) {
        toastDebugCounter++;
        console.log(`[TOAST DEBUG ${toastDebugCounter}] showToast被调用:`, message, type);
        
        // 内容去重：检查队列中是否已存在相同内容的提示
        const isDuplicate = toastQueue.some(item => item.message === message);
        if (isDuplicate) {
            console.log('[TOAST DEBUG] 检测到重复内容，跳过添加:', message);
            return;
        }
        
        // 将消息添加到队列
        toastQueue.push({ message, type, duration });
        
        // 如果当前没有toast在显示，且没有在处理中，则开始处理队列
        if (!isToastShowing && !toastProcessingLock) {
            console.log('[TOAST DEBUG] 开始处理队列，当前队列长度:', toastQueue.length);
            processToastQueue();
        } else {
            console.log('[TOAST DEBUG] 已有toast在显示或正在处理，排队等待，当前队列长度:', toastQueue.length);
        }
    }
    
    // 处理toast队列
    function processToastQueue() {
        // 如果已经有处理锁，直接返回
        if (toastProcessingLock) {
            console.log('[TOAST DEBUG] 已有处理锁，跳过本次处理');
            return;
        }
        
        // 设置处理锁
        toastProcessingLock = true;
        
        // 如果队列为空，标记为非显示状态并返回
        if (toastQueue.length === 0) {
            isToastShowing = false;
            toastProcessingLock = false; // 释放锁
            console.log('[TOAST DEBUG] 队列为空，重置显示状态并释放锁');
            return;
        }
        
        // 取出队列中的第一个消息
        const toastItem = toastQueue.shift();
        console.log('[TOAST DEBUG] 处理队列项:', toastItem.message, '剩余队列长度:', toastQueue.length);
        
        // 显示当前toast
        showSingleToast(toastItem.message, toastItem.type, toastItem.duration);
    }
    
    // 显示单个toast的核心函数
    function showSingleToast(message, type, duration) {
        const toastContainer = document.getElementById('toastContainer');
        
        // 创建toast元素
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        
        // 添加到容器
        toastContainer.appendChild(toast);
        
        // 触发显示动画
        setTimeout(() => {
            toast.classList.add('show');
        }, 10);
        
        // 自动移除
        setTimeout(() => {
            toast.classList.remove('show');
            
            // 动画结束后移除元素
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
                
                // 重要：确保状态重置后再处理下一个队列项
                isToastShowing = false;
                toastProcessingLock = false; // 释放处理锁
                
                // 只有当队列不为空时才继续处理
                if (toastQueue.length > 0) {
                    console.log('[TOAST DEBUG] 当前toast结束，处理下一个，剩余队列长度:', toastQueue.length);
                    processToastQueue();
                } else {
                    console.log('[TOAST DEBUG] 队列已空，停止处理并释放锁');
                }
            }, 300);
        }, duration);
    }
    
    // 清理toast系统资源
    function cleanupToastSystem() {
        console.log('[CLEANUP] 清理toast系统');
        toastQueue = [];
        isToastShowing = false;
        toastDebugCounter = 0;
        
        // 移除所有现有的toast元素
        const toastContainer = document.getElementById('toastContainer');
        if (toastContainer) {
            toastContainer.innerHTML = '';
        }
    }
    
    // 复制文本到剪贴板
    function copyToClipboard(text, fieldName) {
        // 检查 Clipboard API 是否可用
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${fieldName} 已复制到剪贴板: ${text}`, 'success');
            }).catch(err => {
                console.error('Clipboard API 复制失败:', err);
                // 使用降级方案
                fallbackCopyTextToClipboard(text, fieldName);
            });
        } else {
            // Clipboard API 不可用，直接使用降级方案
            console.log('Clipboard API 不可用，使用降级方案');
            fallbackCopyTextToClipboard(text, fieldName);
        }
    }
    
    // 降级复制方法
    function fallbackCopyTextToClipboard(text, fieldName) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        // 避免滚动到底部
        textArea.style.position = 'fixed';
        textArea.style.top = '-9999px';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                showToast(`${fieldName} 已复制到剪贴板: ${text}`, 'success');
            } else {
                showToast(`复制失败`, 'error');
            }
        } catch (err) {
            console.error('execCommand 复制失败:', err);
            showToast(`复制失败: ${err.message}`, 'error');
        } finally {
            document.body.removeChild(textArea);
        }
    }
    
    // 获取当前时间（修正时区问题）
    function getNow() {
        const now = new Date();
        // 使用 toLocaleString 确保本地时间
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }
    
    // 解析日期字符串
    function parserDate(dateStr) {
        if (!dateStr) return new Date();
        return new Date(dateStr.replace(/-/g, '/'));
    }
    
    // 秒转时间格式
    function secToTimeFormat(seconds) {
        if (!seconds || seconds < 0) return '00:00:00';
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    
    // 分钟转小时:分钟:秒格式（精确到秒，优化精度处理）
    function minutesToHMS(totalMinutes) {
        console.log('=== minutesToHMS 被调用 ===');
        console.log('输入参数 totalMinutes:', totalMinutes);
        
        // 确保输入是有效数字
        totalMinutes = Number(totalMinutes);
        if (isNaN(totalMinutes) || totalMinutes === undefined || totalMinutes === null) {
            totalMinutes = 0;
        }
        
        // 特殊处理：小于1分钟的情况也要显示秒
        if (totalMinutes < 1 && totalMinutes > 0) {
            const totalSeconds = Math.round(totalMinutes * 60);
            const result = {
                hours: 0,
                minutes: 0,
                seconds: totalSeconds
            };
            
            console.log('小于1分钟处理 - 总秒数:', totalSeconds);
            console.log('计算结果:', result);
            console.log('返回格式: ' + result.hours + '小时' + result.minutes + '分' + result.seconds + '秒');
            
            return result;
        }
        
        // 对于整数分钟，直接处理避免浮点精度问题
        if (Number.isInteger(totalMinutes)) {
            const totalSeconds = totalMinutes * 60;
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            const result = {
                hours: hours,
                minutes: minutes,
                seconds: seconds
            };
            
            console.log('整数分钟处理 - 总秒数:', totalSeconds);
            console.log('计算结果:', result);
            console.log('返回格式: ' + result.hours + '小时' + result.minutes + '分' + result.seconds + '秒');
            
            return result;
        }
        
        // 转换为总秒数（保持小数精度）
        let totalSeconds = Math.round(totalMinutes * 60);  // 使用round保持精度
        
        // 移除修约处理，让总时长也能显示真实的秒数
        // 不再强制修约为整数分钟，保持原有的精度
        
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        
        const result = {
            hours: hours,
            minutes: minutes,
            seconds: seconds
        };
        
        console.log('总秒数:', totalSeconds);
        console.log('计算结果:', result);
        console.log('返回格式: ' + result.hours + '小时' + result.minutes + '分' + result.seconds + '秒');
        
        return result;
    }
    
    // 格式化时间字符串为分钟数 (例如: "84时59分" -> 5099)
    function parseTimeString(timeStr) {
        if (!timeStr) return 0;
        const hourMatch = timeStr.match(/(\d+)时/);
        const minMatch = timeStr.match(/(\d+)分/);
        const hours = hourMatch ? parseInt(hourMatch[1]) : 0;
        const mins = minMatch ? parseInt(minMatch[1]) : 0;
        return hours * 60 + mins;
    }
    
    // 计算总时长（秒）
    function calculateTotalDuration(user) {
        console.log('=== calculateTotalDuration 被调用 ===');
        console.log('输入用户数据:', user);
        
        let billing_type = user.package_billing_type;
        let expired_time = user.expired_time;
        let user_earn_minutes = user.user_earn_minutes;
        let last_pause_time = user.last_pause_time;
        let pause_status = user.pause_status;
        
        console.log('billing_type:', billing_type);
        console.log('expired_time:', expired_time);
        console.log('user_earn_minutes:', user_earn_minutes);
        console.log('last_pause_time:', last_pause_time);
        console.log('pause_status:', pause_status);
        
        let now = getNow();
        let time_diff = 0;
        
        if (billing_type == 1) {
            console.log('开始计算总时长...');

        console.log('billing_type不为1，返回0');

    // 可暂停剩余时长计算（从总时长中减去不可暂停时长）
    function calculatePausableDuration(user) {
        // 计算总时长
        const totalSeconds = calculateTotalDuration(user);
        
        // 计算不可暂停时长
        const nonPausableSeconds = calculateNonPausableDuration(user) * 60; // 转为秒
        
        // 可暂停 = 总时长 - 不可暂停
        const pausableSeconds = totalSeconds - nonPausableSeconds;
        
        if (pausableSeconds <= 0) return 0;
        
        // 返回带小数的分钟数（保持精度，添加最大值限制）
        let minutes = pausableSeconds / 60;  // 不使用Math.floor，保持小数
        
        // 添加最大值限制
        const maxMinutes = 60000000; // 最大允许的分钟数（支持1000000小时）
        if (minutes > maxMinutes) {
            console.warn(`可暂停时长计算结果过大: ${minutes}分钟，限制为${maxMinutes}分钟`);
            minutes = maxMinutes;
        }
        
        console.log('总时长:', (totalSeconds/60).toFixed(2), '分钟');
        console.log('不可暂停:', (nonPausableSeconds/60).toFixed(2), '分钟');
        console.log('可暂停时长:', minutes.toFixed(2), '分钟 =', (minutes/60).toFixed(2), '小时');
        
        return minutes;
    }
    
    // 不可暂停剩余时长 - 优化计算方法（直接计算，避免精度损失）
    function calculateNonPausableDuration(user) {
        let expired_experience_time = user.expired_experience_time;
        
        console.log('=== calculateNonPausableDuration 被调用 ===');
        console.log('输入用户数据:', user);
        console.log('expired_experience_time:', expired_experience_time);
        
        if (!expired_experience_time) {
            console.log('expired_experience_time为空，返回0');
            return 0;
        }
        
        // 获取当前时间
        const now = getNow();
        console.log('计算不可暂停时长:');
        console.log('  expired_experience_time:', expired_experience_time);
        console.log('  now:', now);
        
        // 直接计算时间差（毫秒）
        let time_diff_ms = parserDate(expired_experience_time).getTime() - parserDate(now).getTime();
        console.log('  时间差(毫秒):', time_diff_ms);
        
        if (time_diff_ms <= 0) {
            console.log('时间差小于等于0，返回0');
            return 0;
        }
        
        // 直接转换为分钟数（避免中间格式化步骤）
        let time_diff_minutes = time_diff_ms / (1000 * 60); // 直接转换为分钟
        console.log('  时间差(分钟):', time_diff_minutes);
        console.log('  时间差(秒):', time_diff_ms / 1000);
        
        // 确保返回值有效
        if (isNaN(time_diff_minutes) || time_diff_minutes === undefined || time_diff_minutes === null) {
            console.log('计算结果无效，返回0');
            return 0;
        }
        
        return time_diff_minutes;
    }
    
    // 登录获取token
    async function login() {
        const phone = document.getElementById('phone').value;
        const smscode = document.getElementById('smscode').value;
        const loginBtn = document.getElementById('loginBtn');
        
        if (!phone || !smscode) {
            showMessage('请填写完整的登录信息', 'error');
            return;
        }
        
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="loading"></span> 登录中...';
        
        try {
            const response = await fetch('https://vf-staffapi.leigod.com/staff/login/code', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    phone: phone,
                    smscode: smscode,
                    smscode_key: ''
                })
            });
            
            const data = await response.json();
            
            if (data.code === 0 && data.data && data.data.login_info) {
                accountToken = data.data.login_info.account_token;
                const expiryTime = data.data.login_info.expiry_time;
                const userName = data.data.user_info.name;
                
                // 保存到本地存储
                localStorage.setItem('accountToken', accountToken);
                localStorage.setItem('tokenExpiryTime', expiryTime);
                
                showMessage(`登录成功! 欢迎 ${userName}, Token有效期至: ${expiryTime}`, 'success');
                
                // 显示token信息
                const tokenDisplay = document.getElementById('tokenDisplay');
                tokenDisplay.innerHTML = `<strong>Token:</strong> ${accountToken.substring(0, 20)}...`;
                tokenDisplay.style.display = 'block';
                
                // 启用搜索按钮
                document.getElementById('searchBtn').disabled = false;

    // 格式化日期时间为input datetime-local格式
    function formatDateTimeForInput(dateTimeStr) {
        console.log('formatDateTimeForInput 被调用，输入:', dateTimeStr);
        
        if (!dateTimeStr || dateTimeStr === '--') {
            console.log('返回空字符串');
            return '';
        }
        
        try {
            // 解析日期时间字符串
            const date = new Date(dateTimeStr);
            console.log('解析后的Date对象:', date);
            
            if (isNaN(date.getTime())) {
                console.log('日期无效，返回空字符串');
                return '';
            }
            
            // 转换为本地时区的 YYYY-MM-DDTHH:mm 格式
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            
            const result = `${year}-${month}-${day}T${hours}:${minutes}`;
            console.log('格式化结果:', result);
            return result;
        } catch (error) {
            console.error('日期格式化错误:', error);
            return '';
        }
    }

        }
        
        const now = new Date();
        let targetDateTime = null;
        
        if (type === 'unpaid') {
            // 未付费用户：设置为null
            targetDateTime = null;
        } else if (type === 'today') {
            // 当日付费用户：今天的时间
            
            // 获取今天的开始时间（00:00:00）
            const todayStart = new Date(now);
            todayStart.setHours(0, 0, 0, 0);
            
            // 在今天的时间范围内随机选择一个时间点
            const timeRange = now.getTime() - todayStart.getTime();
            targetDateTime = new Date(todayStart.getTime() + Math.random() * timeRange);
            
            // 调试信息

            console.log('今天开始时间:', todayStart);
            console.log('当前时间:', now);
            console.log('随机时间:', targetDateTime);
        } else if (type === 'yesterday') {
            // 昨日付费用户：昨天的时间
            const yesterday = new Date(now);
            yesterday.setDate(yesterday.getDate() - 1);
            
            // 获取昨天的开始时间（00:00:00）
            const yesterdayStart = new Date(yesterday);
            yesterdayStart.setHours(0, 0, 0, 0);
            
            // 获取昨天的结束时间（23:59:59）
            const yesterdayEnd = new Date(yesterday);
            yesterdayEnd.setHours(23, 59, 59, 999);

    // 清除可暂停时长（使用扣减接口）- 精确版本
    async function clearPausableDuration() {
        if (!accountToken || !currentUserId || !currentUserData) {
            showToast('请先查询用户信息', 'error');
            return;
        }
        
        const btn = document.getElementById('btn4');
        if (btn && btn.disabled) {
            showToast('操作进行中，请稍候...', 'warning');
            return;
        }
        
        try {
            // 计算当前可暂停时长
            const pausableMinutes = calculatePausableDuration(currentUserData);
            console.log('计算得到的可暂停时长:', pausableMinutes, '分钟');
            console.log('对应秒数:', pausableMinutes * 60, '秒');
            
            if (pausableMinutes > 0) {
                // 使用向上取整确保完全清零
                const roundedMinutes = Math.ceil(pausableMinutes);
                console.log('向上取整后的扣减分钟数:', roundedMinutes);
                
                // 分多次扣减确保完全清零
                let remainingMinutes = pausableMinutes;
                let attempts = 0;
                const maxAttempts = 3;
                
                while (remainingMinutes > 0.01 && attempts < maxAttempts) { // 0.01分钟 = 0.6秒的容忍度
                    attempts++;
                    const currentDeduct = Math.min(roundedMinutes, Math.ceil(remainingMinutes));
                    console.log(`第${attempts}次扣减: ${currentDeduct}分钟`);
                    
                    await reduceDuration(1, currentDeduct, `清除可暂停时长(${currentDeduct}分钟)`);
                    
                    // 等待并重新查询
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    await searchUser();
                    
                    // 重新计算剩余时长
                    const newMinutes = calculatePausableDuration(currentUserData);
                    console.log(`第${attempts}次扣减后剩余:`, newMinutes, '分钟');
                    remainingMinutes = newMinutes;
                }
                
                if (remainingMinutes <= 0.01) {
                    showToast('可暂停时长已清空', 'success');
                } else {
                    showToast(`清除完成，剩余${remainingMinutes.toFixed(2)}分钟`, 'warning');
                }
            } else {
                showToast('可暂停时长已为0', 'info');
            }
        } catch (error) {
            console.error('清除可暂停时长失败:', error);
            showToast('清除可暂停时长失败: ' + error.message, 'error');

    // 扣减用户时长（使用专门的扣减接口）- 优化版本
    async function reduceDuration(reduceType, reduceMinutes, description) {
        if (!accountToken || !currentUserId) {
            showToast('请先登录并查询用户信息', 'error');
            return;
        }
        
        // 强制数值限制
        const maxReduceMinutes = 999999; // 最大扣减分钟数（支持10000小时）
        const minReduceMinutes = -999999; // 最小扣减分钟数
        
        let finalReduceMinutes = Number(reduceMinutes);
        if (isNaN(finalReduceMinutes)) {
            console.error('无效的扣减参数:', reduceMinutes);
            showToast('扣减参数无效', 'error');
            return;
        }
        
        // 确保扣减值为正数并向上取整
        finalReduceMinutes = Math.ceil(Math.abs(finalReduceMinutes));
        
        if (finalReduceMinutes > maxReduceMinutes) {
            finalReduceMinutes = maxReduceMinutes;
        } else if (finalReduceMinutes < minReduceMinutes) {
            finalReduceMinutes = minReduceMinutes;
        }
        
        // 防重复点击保护
        const operationKey = `reduce_${reduceType}_${finalReduceMinutes}_${Date.now()}`;
        const operationFlag = `reduce_operation_${operationKey}`;
        
        if (window[operationFlag]) {
            showToast('相同操作正在进行中，请稍候...', 'warning');
            return;
        }
        
        window[operationFlag] = true;
        
        try {
            const url = `https://vf-staffapi.leigod.com/staff/member/time/${currentUserId}`;
            
            // 构造扣减请求参数（根据1.txt中的接口文档）
            const params = new URLSearchParams();
            params.append('account_token', accountToken);
            params.append('reduce_type', reduceType.toString());
            params.append('reduce_time', finalReduceMinutes.toString()); // 使用处理后的精确值
            params.append('invoice_money', '0');
            
            console.log(`发送扣减请求参数:`, {
                reduce_type: reduceType,
                reduce_time: finalReduceMinutes,
                invoice_money: 0
            });
            
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            });
            
            const data = await response.json();
            
            if (data.code === 0) {
                // 不显示中间成功提示，只在最终查询时显示
                setTimeout(() => searchUser(), 1000);
            } else {
                showToast(`扣减失败: ${data.msg || '未知错误'}, 错误码: ${data.code}`, 'error');
            }
        } catch (error) {
            console.error('扣减请求失败:', error);
            showToast(`扣减失败: ${error.message}`, 'error');
        } finally {
            setTimeout(() => {
                window[operationFlag] = false;
            }, 2000);
        }
    }
    async function setDuration(durationType, deltaMinutes, description, customDesc = '补偿') {
        if (!accountToken || !currentUserId) {
            showToast('请先登录并查询用户信息', 'error');
            return;
        }
        
        // === 强制数值限制（最终防线） ===
        const maxDeductMinutes = 60000000; // 最大扣除分钟数（支持1000000小时）
        const minDeductMinutes = -60000000; // 最小扣除分钟数
        
        // 强制类型转换和范围检查
        let finalDeltaMinutes = Number(deltaMinutes);
        if (isNaN(finalDeltaMinutes)) {
            console.error('无效的时长参数:', deltaMinutes);
            showToast('时长参数无效', 'error');
            return;
        }
        
        // 强制范围限制
        if (finalDeltaMinutes > maxDeductMinutes) {
            console.warn(`时长参数过大: ${finalDeltaMinutes}，强制限制为${maxDeductMinutes}`);
            finalDeltaMinutes = maxDeductMinutes;
        } else if (finalDeltaMinutes < minDeductMinutes) {
            console.warn(`时长参数过小: ${finalDeltaMinutes}，强制限制为${minDeductMinutes}`);
            finalDeltaMinutes = minDeductMinutes;
        }
        
        console.log(`=== setDuration最终参数检查 ===`);
        console.log(`原始参数: ${deltaMinutes}`);
        console.log(`最终参数: ${finalDeltaMinutes}`);
        
        // 创建操作标识，防止重复请求
        const operationKey = `${durationType}_${finalDeltaMinutes}_${Date.now()}`;
        const operationFlag = `duration_operation_${operationKey}`;
        
        // 检查是否正在进行相同操作
        if (window[operationFlag]) {
            showToast('相同操作正在进行中，请稍候...', 'warning');
            return;
        }
        
        // 标记操作正在进行
        window[operationFlag] = true;
        
        try {
            const url = `https://vf-staffapi.leigod.com/staff/member/${currentUserId}/duration`;
                                
            // 构造URL编码的表单数据，匹配curl命令格式
            const params = new URLSearchParams();
            params.append('account_token', accountToken);
            params.append('id', '0');
            params.append('duration_type', durationType.toString());
            params.append('minutes_type', '9');
            params.append('send_time_type', '1');
            params.append('minutes', Math.round(finalDeltaMinutes).toString()); // 使用最终限制后的值
            params.append('desc', customDesc);
                                
            console.log(`发送请求参数:`, {
                duration_type: durationType,
                minutes: Math.round(finalDeltaMinutes),
                desc: customDesc
            });
                                
            // 添加重试机制
            let retryCount = 0;
            const maxRetries = 3;
            
            while (retryCount < maxRetries) {
                try {
                    const response = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'User-Agent': 'Mozilla/5.0'
                        },
                        body: params.toString()
                    });
                                
                    const data = await response.json();
                                
                    if (data.code === 0) {
                        // 不显示中间成功提示，只在最终查询时显示
                        // 重新查询用户信息以更新显示
                        setTimeout(() => {
                            searchUser();
                        }, 1000);
                        return; // 成功则退出
                    } else if (data.code === 500001) {
                        // 如果是重复点击错误，等待后重试
                        retryCount++;
                        const delay = 1000 * retryCount; // 递增延迟：1秒, 2秒, 3秒
                        console.log(`收到重复点击错误(500001)，第${retryCount}次重试，等待${delay}ms...`);
                        
                        if (retryCount <= maxRetries) {
                            await new Promise(resolve => setTimeout(resolve, delay));
                            continue; // 继续重试循环
                        } else {
                            showToast(`操作失败: ${data.msg || '请勿重复点击'}`, 'error');
                            console.log('达到最大重试次数，放弃重试');
                            return;
                        }
                    } else {
                        showToast(`设置失败: ${data.msg || '未知错误'}, 错误码: ${data.code}`, 'error');
                        
                        // 如果是token过期错误（400006），刷新token后重试
                        if (data.code === 400006) {
                            console.log('检测到token过期或无效，正在切换账号重新登录...');
                                    
                            // 清除本地存储的无效token
                            localStorage.removeItem('accountToken');
                            localStorage.removeItem('tokenExpiryTime');
                            accountToken = '';
                            tokenExpiryTime = null;
                                    
                            // 使用新账号重新登录
                            const loginSuccess = await autoLogin(true);
                            if (loginSuccess && accountToken) {
                                showToast('账号切换成功，正在重试...', 'info');
                                        
                                // 使用新token重试请求
                                params.set('account_token', accountToken);
                                continue; // 继续重试循环
                            } else {
                                showToast('无法获取有效账号，请检查登录状态', 'error');
                                return;
                            }
                        }
                        return; // 其他错误直接返回
                    }
                } catch (error) {
                    console.error('请求失败:', error);
                    if (retryCount < maxRetries - 1) {
                        retryCount++;
                        console.log(`网络请求失败，第${retryCount}次重试...`);
                        await new Promise(resolve => setTimeout(resolve, 1000 * retryCount));
                        continue;
                    } else {
                        showToast(`设置失败: ${error.message}`, 'error');
                        
                        // 检查是否是网络错误或token相关错误，尝试重新登录
                        if (error.message.includes('token') || error.message.includes('400006')) {
                            localStorage.removeItem('accountToken');
                            localStorage.removeItem('tokenExpiryTime');
                            accountToken = '';
                            tokenExpiryTime = null;
                            
                            await autoLogin(true);
                        }
                        return;
                    }
                }
            }
        } finally {
            // 清除操作标记
            setTimeout(() => {
                window[operationFlag] = false;
            }, 2000); // 2秒后允许重复操作
        }
    }

    // 缓存DOM元素
    let countryCodeElements = null;
    
    function getCountryCodeElements() {
        if (!countryCodeElements) {
            countryCodeElements = {
                hiddenInput: document.getElementById('countryCode'),
                displayInput: document.getElementById('countryCodeInput')
            };
        }
        return countryCodeElements;
    }
    
    // 处理区号输入（优化版）
    function handleCountryCodeInput(value) {
        const elements = getCountryCodeElements();
        if (!elements.hiddenInput || !elements.displayInput) return;
                    
        // 如果输入的是 + 开头的区号
        if (value.startsWith('+')) {
            const code = value.substring(1);
            elements.hiddenInput.value = code;
            return;
        }
                    
        // 如果输入的是纯数字
        if (/^\d+$/.test(value)) {
            elements.hiddenInput.value = value;
            return;
        }
                    
        // 如果输入的是国家名称，查找对应的区号
        const lowerValue = value.toLowerCase().trim();
        if (lowerValue in COUNTRY_MAP) {
            const code = COUNTRY_MAP[lowerValue];
            elements.hiddenInput.value = code;
            elements.displayInput.value = `+${code}`;
        }
    }
            
    // 防抖函数
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }
    
    // 区号模糊搜索（优化版）
    function setupCountryCodeSearch() {
        const phoneInput = document.getElementById('searchValue');
        const hiddenInput = document.getElementById('countryCode');
        
        if (!phoneInput || !hiddenInput) return;
                
        // 使用预定义的搜索映射
        const searchMap = COUNTRY_MAP;
                
        // 防抖处理的输入事件
        const debouncedHandler = debounce(function(e) {
            const value = e.target.value.toLowerCase().trim();
                    
            // 检查是否匹配 +86 格式
            if (value.startsWith('+')) {
                const code = value.substring(1);
                if (code in searchMap) {
                    const actualCode = searchMap[code];
                    hiddenInput.value = actualCode;
                    return;
                }
            }
                    
            // 检查是否匹配中文/英文关键词
            if (value in searchMap) {
                const code = searchMap[value];
                hiddenInput.value = code;
            }
        }, 100); // 100ms防抖延迟
                
        // 监听手机号输入框事件
        phoneInput.addEventListener('input', debouncedHandler);
    }
